x-bounded-logs: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  ekosim-postgres:
    logging: *bounded-logs
    image: postgres:15-alpine
    container_name: ekosim-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-ekosim}
      - POSTGRES_USER=${POSTGRES_USER:-ekosim}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d:ro
    networks:
      - ekosim-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ekosim} -d ${POSTGRES_DB:-ekosim}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ekosim-backend:
    logging: *bounded-logs
    mem_limit: ${SIMULATOR_MEMORY_LIMIT:-512m}
    memswap_limit: ${SIMULATOR_MEMORY_LIMIT:-512m}
    cpus: "${SIMULATOR_CPU_LIMIT:-0.75}"
    build:
      context: ../ekosimProject
      dockerfile: ../EkoSim-Infrastructure/dockerfiles/backend.Dockerfile
    container_name: ekosim-backend
    environment:
      - POSTGRES_HOST=ekosim-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-ekosim}
      - POSTGRES_USER=${POSTGRES_USER:-ekosim}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - backend-data:/var/app/current/myDB
    networks:
      - ekosim-network
    depends_on:
      ekosim-postgres:
        condition: service_healthy
    restart: unless-stopped

  ekosim-api:
    logging: *bounded-logs
    build:
      context: ../EkosimWeb
      dockerfile: ../EkoSim-Infrastructure/dockerfiles/api.Dockerfile
    container_name: ekosim-api
    environment:
      - NODE_ENV=development
      - PORT=3001
      - POSTGRES_HOST=ekosim-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-ekosim}
      - POSTGRES_USER=${POSTGRES_USER:-ekosim}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - BACKEND_URL=http://ekosim-backend:8080
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    networks:
      - ekosim-network
    depends_on:
      ekosim-postgres:
        condition: service_healthy
      ekosim-backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ekosim-frontend:
    logging: *bounded-logs
    build:
      context: ../EkosimWeb
      dockerfile: ../EkoSim-Infrastructure/dockerfiles/frontend.production.Dockerfile
    container_name: ekosim-frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - API_URL=http://ekosim-api:3001
    volumes:
      - ./logs/nginx:/var/log/nginx
    networks:
      - ekosim-network
    depends_on:
      ekosim-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  backend-data:
    driver: local

networks:
  ekosim-network:
    driver: bridge
